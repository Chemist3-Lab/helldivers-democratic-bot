[project]
name = "helldivers-democratic-bot"
version = "1.0.0"
description = "A 24/7 Helldivers 2 Discord bot — Galactic War alerts, Steam news, Wiki RAG, and scoreboard MMR."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "discord.py>=2.4,<3",
    "google-genai>=1.0,<2",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.5",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
]

[project.scripts]
helldivers-bot = "src.main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["discord.*", "sqlmodel.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"
